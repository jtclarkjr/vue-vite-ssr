<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A production-minded Nitro, Vue, Vite+, and Bun starter." />
    <title>Vue Vite+ SSR</title>
  </head>
  <body>
    <script server>
      const ssrResponse =
        typeof fetchViteEnv === 'function'
          ? await fetchViteEnv('ssr', $REQUEST)
          : await globalThis.__nitro_vite_envs__?.ssr?.fetch($REQUEST)

      if (ssrResponse) $RESPONSE.status = ssrResponse.status
    </script>
    <!--ssr-outlet-->
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
